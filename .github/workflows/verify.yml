name: Verify GateShield
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Test reference model
        run: python -m unittest discover -s tests -v
      - name: Differential RTL simulation
        run: python scripts/check_rtl.py
      - name: Engine transactions and cross-architecture replay
        run: python scripts/check_engine.py
      - name: Generic synthesis smoke checks
        run: python scripts/check_synthesis.py
      - name: Upload comparison reports and synthesis logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateshield-comparison-reports
          path: |
            build/*.csv
            build/stat_*.json
            build/synthesis_*.log
